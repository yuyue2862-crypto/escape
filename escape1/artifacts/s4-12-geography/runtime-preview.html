<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S4-12 第三阶段地图验收预览</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../task4/task4.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02080e; }
    .task4-stage { position: fixed; inset: 0; overflow: hidden; }
  </style>
</head>
<body>
  <main class="task4-stage is-s412-arrival" aria-label="S4-12 第三阶段验收预览">
    <section class="task4-arrival is-visible is-map-visible is-arrived is-success-visible is-action-visible" aria-label="抵达珠海">
      <div class="task4-return-imagery is-image-visible is-instant" data-scene="pearl-river-delta" aria-live="polite">
        <div class="task4-return-imagery__frame">
          <img class="task4-return-imagery__image" src="../../assets/task4/return-journey/pearl-river-delta-tech-map.png" alt="基于 OpenStreetMap 真实地理数据绘制的珠江三角洲地图" />
          <div class="task4-return-imagery__shade" aria-hidden="true"></div>
          <div class="task4-return-imagery__target" style="--target-x:49.490%;--target-y:71.257%" aria-label="珠海，22.27度北，113.58度东">
            <span class="task4-return-imagery__target-ring" aria-hidden="true"></span>
            <strong>珠海</strong>
            <small>22.27°N，113.58°E</small>
          </div>
        </div>
        <div class="task4-return-imagery__meta">
          <span class="task4-return-imagery__label">珠江口 · 粤港澳大湾区</span>
          <small class="task4-return-imagery__credit">Map data © OpenStreetMap contributors · ODbL</small>
        </div>
      </div>
      <div class="task4-arrival__result" aria-live="polite">
        <h2>返航成功</h2>
        <p>你找到了回家的坐标——珠海。</p>
        <button type="button">查看返航记录</button>
      </div>
    </section>
  </main>
</body>
</html>
