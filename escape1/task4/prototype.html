<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>真实地球 · 北京定位测试</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="task4.css" />
  </head>
  <body class="task4-prototype">
    <section id="prototypeStage" class="task4-stage" hidden aria-hidden="true">
      <div id="prototypeGlobe" class="task4-globe-mount"></div>
      <output id="prototypeCoordinates" class="task4-prototype__coordinates" aria-live="polite">当前位置：<br>纬度：—　经度：—</output>
    </section>
    <script src="natural-earth-land-data.js"></script>
    <script src="real-earth-globe.js"></script>
    <script src="task4-flow.js"></script>
    <script>
      window.task4Prototype = window.Task4Flow.create({
        stage: document.querySelector("#prototypeStage"),
        globeMount: document.querySelector("#prototypeGlobe"),
        onSurfaceSelect: ({ latitude, longitude }) => {
          document.querySelector("#prototypeCoordinates").textContent =
            `当前位置：\n纬度：${latitude.toFixed(2)}°　经度：${longitude.toFixed(2)}°`;
        },
      });
      window.task4Prototype.initialize();
      window.task4Prototype.setGlobeView({ latitude: 18, longitude: 0 });
      window.task4Prototype.start();
    </script>
  </body>
</html>
